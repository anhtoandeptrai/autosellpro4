name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meteor-addon-template-6b0dbefc224c16f23221493124b079b71576b442
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x gradlew
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: addon-jar
          path: meteor-addon-template-6b0dbefc224c16f23221493124b079b71576b442/build/libs/*.jar
